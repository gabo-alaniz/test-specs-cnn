name: ci

on:
  push:
  pull_request:
  workflow_dispatch:  # spec-from-issue lo lanza en los PRs del bot (GITHUB_TOKEN no dispara push/pull_request)

permissions:
  contents: read

jobs:
  traceability:
    if: github.event_name == 'pull_request' || startsWith(github.ref_name, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Link branch, diff, spec and tested fingerprint
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--branch "$BRANCH_NAME" --head "$HEAD_SHA")
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA"); fi
          ./speckit ci-guard "${args[@]}"

  speckit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtual environment and install locked requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r .agents/requirements-dev.txt
      - name: Shell syntax
        run: bash -n speckit
      - name: Validator and CLI tests
        run: .venv/bin/python -m unittest discover -s .agents/tests -v
      - name: Stdlib fallback tests
        run: .venv/bin/python -S -m unittest discover -s .agents/tests -v
      - name: Validate examples
        run: ./speckit validate --no-files .agents/examples/*.json .agents/templates/state.json
      - name: Validate reference spec
        run: ./speckit validate .agents/examples/001-archive-specs
      - name: Validate specs
        run: ./speckit validate --all

  secrets:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
